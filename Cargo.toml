[workspace]
resolver = "2"
members = [
    "crates/aaaudio-dsp",
    "crates/aaaudio-router",
    "crates/aaaudio-daemon",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pablo Alcolea Sesse"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/PabloAlcoleaSesse/AAAudio"
homepage = "https://github.com/PabloAlcoleaSesse/AAAudio"

[workspace.dependencies]
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
